render_math:
  # mathtext strings; every math/note re-encodes an existing math: or status passage above -
  # no new mathematics; value lines carry vsrc to the manuscript-stated number.
  symbols:
    "X^mu, Theta (matrix kinematics)": {math: '$X^{\mu},\;\Theta^{\mu\nu}$'}
    "S_matrix":                        {math: '$S_{\mathrm{matrix}}$'}
    "S_micro[Phi,A]":                  {math: '$S_{\mathrm{micro}}[\Phi,A]$'}
    "Lambda_UV":                       {math: '$\Lambda_{\mathrm{UV}}\sim\Theta^{-1/2}$', note: 'eq:LUV-def ch03:119'}
    "Phi^I_A, v (locked vacuum)":      {math: '$\Phi^{I}_{A},\;v$'}
    "V (potential)":                   {math: '$V(\Phi)$'}
    "delta Phi_{mu nu} (fluctuation)": {math: '$\delta\Phi_{\mu\nu}$'}
    "S_D, rho_D, H_D (modular data)":  {math: '$S_{D},\;\rho_{D},\;H_{D}$'}
    "I(A:B)":                          {math: '$I(A\!:\!B)$'}
  premises:
    ass:dictionary:     {math: '$[X_{\mu},\Phi]\leftrightarrow i\Theta_{\mu\nu}D^{\nu}\Phi$'}
    ass:EE:             {math: '$\delta S_{D}=0$', note: 'fixed volume'}
    ass:frame-lock:     {note: 'locked vacuum exists'}
    ass:nondeg:         {note: 'non-degenerate frame'}
    ass:lorentzian:     {math: '$\eta_{AB}=\mathrm{diag}(-1,+,+,+)$'}
    ass:local-lorentz:  {note: 'SO(3,1) imposed by hand'}
    ass:locked-block:   {note: 'locked block (Ch5)'}
    ass:gap-psi:        {math: '$m_{\psi}\sim\sqrt{\lambda}\,v$'}
    ass:EFT-a2:         {note: '4-deriv terms = EFT vertices'}
    ass:emergent-op:    {note: 'operator on emergent g'}
    ass:Sent-density:   {math: '$S_{\mathrm{ent}}(h_{ij},\phi)$', note: 'dim 3'}
    ass:bdy-EE:         {note: 'S_HBEV stationary'}
    ass:drag:           {math: '$F_{\mathrm{diss}}=-\eta(\mu/d^{4})v$'}
    ass:ECG:            {note: 'cubic completion model'}
  displays:
    qm.matrix:      {label: 'eq:NC',       math: '$[X^{\mu},X^{\nu}]=i\Theta^{\mu\nu}$'}
    qm.cond:        {label: 'eq:V',        math: '$V=\frac{\lambda}{4}\mathrm{Tr}(\Phi^{\dagger}\Phi-v^{2}I)^{2}$'}
    qm.modular:     {label: 'def:SD',      math: '$S_{D}=-\mathrm{Tr}(\rho_{D}\ln\rho_{D})$'}
    A.map:          {label: 'eq:dict-again', math: '$[X_{\mu},\Phi]\leftrightarrow i\Theta_{\mu\nu}D^{\nu}\Phi$', note: 'target: derived'}
    B.ward:         {label: 'eq:first-law', math: '$\delta S_{D}=\frac{2\pi}{\kappa}\int d\Sigma^{\mu}\xi^{\nu}\delta\langle T^{\mathrm{op}}\rangle$', math2: '$+\frac{\delta A}{4G_{\mathrm{eff}}}+\mathcal{O}(l^{3})$', note: 'target: tensor-block stationarity'}
    C.scalar:       {label: 'ass:gap-psi', math: '$m_{\psi}\sim\sqrt{\lambda}\,v$', note: 'target: operator, mass, coupling'}
    D1.lorentz:     {label: 'Problem D',   note: 'SO(3,1) local gauge symmetry: derived target'}
    E.sig:          {label: 'ass:lorentzian', math: '$\eta_{AB}=\mathrm{diag}(-1,+,+,+)$', note: 'target: derived signature'}
    F.coeff:        {label: 'eq:W4',       math: '$W_{4}[g]=\int\sqrt{-g}\,(c_{W}C^{2}+c_{R}R^{2}+\cdots)$', note: 'target: rationals A,B,C; physical G_eff'}
    G.ent:          {label: 'ass:Sent-density', math: '$S_{\mathrm{ent}}(h_{ij},\phi)$', note: 'target: derived from matrix theory'}
    N.eft:          {label: 'eq:stelle',   math: '$\frac{R}{16\pi G}-\frac{\alpha}{2}C^{2}+\frac{\beta}{2}R^{2}$', note: 'target: no ghost for p<Lambda_UV'}
    H.nu:           {label: 'eq:nu-sqrt',  math: '$\nu(g_{\mathrm{N}})=\frac{1}{1-e^{-\sqrt{g_{\mathrm{N}}/g_{s}}}}$', value: '$g_{s}=1.20\times 10^{-10}\,\mathrm{m\,s^{-2}}$', vsrc: 'chapters/ch13-cores-galaxies.tex:271'}
    I.drag:         {label: 'ass:drag',    math: '$F_{\mathrm{diss}}=-\eta(\mu/d^{4})v$', note: 'target: microscopic exponent, rate'}
    J.ecg:          {label: 'eq:S-ECG',    math: '$S_{\mathrm{ECG}}=\int\sqrt{-g}(\frac{R-2\Lambda_{\mathrm{eff}}}{16\pi G_{\mathrm{eff}}}+\beta_{\mathrm{ECG}}P)$'}
    thm.repairII:   {label: 'eq:g-from-e', math: '$g_{\mu\nu}=\eta_{AB}e^{A}_{\mu}e^{B}_{\nu}$'}
    thm.split:      {label: 'eq:algebraic-split', math: '$\delta\Phi_{\mu\nu}=\frac{1}{4}\eta_{\mu\nu}\psi+F_{\mu\nu}+T_{\mu\nu}$'}
    thm.mT:         {label: 'thm:mT',      math: '$m_{T}=0$', note: '6 premises; conditional'}
    thm.Geff:       {label: 'eq:Geff-thm', math: '$C_{R}^{E}=-\sum w_{s}\frac{A_{1,R,s}}{32\pi^{2}}(\Lambda_{{\mathrm{UV}},s}^{2}-\mu_{s}^{2})$', math2: '$-\sum\cdots\ln +c_{R}(S)$', note: 'truncated; no physical value'}
    thm.locking:    {label: 'thm:locking', math: '$e=\Phi/v$', note: 'unitary gauge'}

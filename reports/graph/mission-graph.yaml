gaps:
  - {symbol: "Weyl map, Hilbert space, continuum limit", blocks: [A.map], note: "Problem A: a derivation must specify the Hilbert space, Weyl map, continuum limit and error at each order in Theta (ch17:390-392); the general matrix-to-modular map remains unproved (appH:16-18)."}
  - {symbol: "g0 -> g map", blocks: [B.EE], note: "B closure requires a specified map g^(0) -> g with no use of an already-existing metric (ch17:134-137); ledger 066 also records the map s -> g_{mu nu} as missing (A, D1)."}
  - {symbol: "F operator data", blocks: [F.coeffs], note: "Gauge-fixed Hessians, determinant weights, radial threshold, finite counterterms and continuation convention are not specified (ch17:457-467; appH Problem F Missing step)."}
  - {symbol: "S_ent^(IR)", blocks: [G.bdy], note: "Entropy density and boundary stationarity not derived from the matrix theory; Assumptions Sent-density and bdy-EE not discharged (ch17:488-495; appH:2894 no-go paragraph)."}
  - {symbol: "kappa_IR", blocks: [H.interp], note: "Chapter 12 supplies Lambda_eff but defines no stationary boundary geometry or surface gravity kappa_IR (ch17:541-544)."}
render_math:
  symbols:
    "X_mu": {math: '$\hat{X}_\mu$', note: "matrices of eq:Smatrix"}
    "S_micro": {math: '$S_{\rm micro}$', note: "eq:Smicro"}
    "Phi": {math: '$\Phi$', note: "condensate field"}
    "A_mu": {math: '$A_\mu$', note: "gauge field of eq:Smicro"}
    "lambda": {math: '$\lambda$', note: "eq:V"}
    "v": {math: '$v$', note: "eq:V vacuum scale"}
  premises:
    "ass:dictionary": {math: '$[\hat X_\mu,\Phi]\leftrightarrow i\Theta_{\mu\nu}D^\nu\Phi$'}
    "Theta_{mu nu}": {math: '$\Theta_{\mu\nu}$'}
    "ass:EE": {math: '$\delta S_D=0$'}
    "ass:gap-psi": {math: '$m_\psi\sim\sqrt{\lambda}\,v$'}
    "ass:frame-lock": {math: '$\langle\Phi^I{}_A\rangle=v\delta^I{}_A$'}
    "ass:nondeg": {math: '$\det e^A{}_\mu\neq0$'}
    "ass:local-lorentz": {note: "local SO(3,1) imposed"}
    "ass:lorentzian": {math: '$\eta_{AB}={\rm diag}(-1,1,1,1)$'}
    "ass:Sent-density": {note: "local entropy density S_ent(h,phi)"}
    "ass:bdy-EE": {math: '$h_{ij}\pi^{ij}=0$'}
    "ass:EFT-a2": {note: "4-derivative terms = EFT vertices"}
    "ass:sqrt-mod": {note: "square-root modular response"}
    "ass:drag": {math: '$F=-\eta\mu v/d^4$'}
    "ass:ECG": {note: "cubic completion"}
  displays:
    "A.map": {label: "eq:dict-again", math: '$[\hat X_\mu,\Phi]\leftrightarrow i\Theta_{\mu\nu}D^\nu\Phi$'}
    "B.EE": {label: "eq:EE", math: '$\delta S_D=0$', note: "fixed volume"}
    "C.conformal": {label: "eq:msigma", math: '$m_\sigma^2=\lambda v^2$', note: "potential curvature only"}
    "D1.lorentz": {label: "eq:g-from-e", math: '$g_{\mu\nu}=\eta_{AB}e^A_\mu e^B_\nu$'}
    "E.signature": {label: "ass:lorentzian", math: '$\eta_{AB}={\rm diag}(-1,1,1,1)$', note: "retained"}
    "F.coeffs": {label: "eq:W-EH", math: '$\frac{1}{16\pi G_{\rm eff}}\int\sqrt{-g}\,R$', note: "A,B,C not computed"}
    "G.bdy": {label: "eq:Leff", math: '$\frac{\Lambda_{\rm eff}}{8\pi G_{\rm eff}}=\langle S_{\rm ent}^{\rm IR}\rangle-T_{\rm bdy}$'}
    "N.expansion": {label: "eq:W4", math: '$c_WC^2+c_RR^2+c_{GB}E_{GB}$', note: "no Ostrogradsky ghost for p<L_UV"}
    "H.interp": {label: "eq:nu-target", math: '$\nu=\frac{1}{1-e^{-\sqrt{g_N/g_s}}}$'}
    "I.drag": {label: "eq:Fdiss", math: '$F=-\eta\mu v/d^4$', note: "working law"}
    "J.ECG": {label: "eq:S-ECG", math: '$S_{\rm ECG}$ cubic invariant $\mathcal{P}$', note: "eq:ECG"}
    "cc.metric": {label: "def:composite-metric", math: '$g_{\mu\nu}=\eta_{AB}e^A_\mu e^B_\nu$'}
    "thm.mT": {label: "thm:mT", math: '$m_T=0$'}
    "thm.Geff": {label: "eq:Geff-thm", math: '$C_R^E=-\sum_s \frac{w_s\mathcal{A}_{1,R,s}}{32\pi^2}(\Lambda_s^2-\mu_s^2)+\ldots$'}
    "thm.locking": {label: "thm:locking", math: '$\omega_{AB}$ removable (unitary gauge)'}
    "thm.conservation": {label: "eq:cons-thm", math: '$\nabla^\mu T^{\rm total}_{\mu\nu}=0$'}
    "thm.Leff": {label: "eq:EFE-Leff", math: '$G_{\mu\nu}+\Lambda_{\rm eff}g_{\mu\nu}=8\pi G_{\rm eff}T_{\mu\nu}$'}
    "ir.D2": {label: "ass:local-lorentz", math: '$SO(3,1)$ imposed', note: "D stays OPEN"}
    "ir.Gmodel": {label: "eq:Leff", math: '$\Lambda_{\rm eff}$ from supplied $S_{\rm ent}$', note: "G stays OPEN"}
    "gr.A": {label: "eq:dictionary", math: '$[\hat X_\mu,\Phi]\leftrightarrow i\Theta D\Phi$ derived'}
    "gr.B": {label: "eq:EE", math: '$\delta S_D=0$ a lemma'}
    "gr.C": {label: "eq:Z-sigma", math: '$m_\psi,\ {\rm coupling}$'}
    "gr.D1": {label: "eq:g-from-e", math: '$SO(3,1)$ derived'}
    "gr.E": {label: "ass:lorentzian", math: '$\eta_{AB}$ derived'}
    "gr.F": {label: "eq:W-EH", math: '$A,B,C,\ G_{\rm eff}$'}
    "gr.G": {label: "eq:Leff", math: '$\Lambda_{\rm eff}$ derived'}
    "gr.N": {label: "eq:W4", math: 'no ghost, $p<\Lambda_{UV}$'}
    "gr.complete": {label: "sec:ch17-done", math: 'matrix-derived IR'}
